<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Masuk — OTW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="phone-frame">
      <div class="brand">
        <div class="brand-mark">OTW</div>
        <div class="brand-copy">
          <strong>Official Trip for Work</strong>
          <span>Business travel, simplified.</span>
        </div>
      </div>

      <section class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Masuk ke OTW</h1>
        <p class="lead">Kelola perjalanan dinas, tiket, dokumen, dan status pesanan dalam satu tempat.</p>

        <div id="notice" class="notice"></div>

        <form id="loginForm" class="form-grid">
          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@instansi.go.id" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required minlength="6">
              <button class="password-toggle" id="togglePassword" type="button">Lihat</button>
            </div>
          </div>

          <div class="action-row">
            <span></span>
            <a class="link" href="forgot-password.html">Lupa password?</a>
          </div>

          <button id="submitBtn" class="primary-btn" type="submit">Masuk</button>
        </form>

        <p class="auth-footer">Belum memiliki akun? <a href="register.html">Daftar sekarang</a></p>
      </section>
    </div>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
