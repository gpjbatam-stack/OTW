<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Perjalanan, dalam Genggaman.">
  <title>LetsGo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#0D1B2A;
      --orange:#FF6A00;
      --white:#FFFFFF;
      --muted:rgba(255,255,255,.62);
      --line:rgba(255,255,255,.08);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--navy);
    }

    body{
      min-height:100vh;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    .splash{
      min-height:100vh;
      min-height:100svh;
      position:relative;
      display:grid;
      place-items:center;
      padding:
        max(28px,env(safe-area-inset-top))
        max(24px,env(safe-area-inset-right))
        max(28px,env(safe-area-inset-bottom))
        max(24px,env(safe-area-inset-left));
      background:var(--navy);
      isolation:isolate;
    }

    .splash::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background-image:
        linear-gradient(var(--line) 1px,transparent 1px),
        linear-gradient(90deg,var(--line) 1px,transparent 1px);
      background-size:46px 46px;
      opacity:.16;
      -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 76%);
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 76%);
    }

    .splash::after{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      top:-245px;
      right:-235px;
      border:56px solid var(--orange);
      border-radius:50%;
      opacity:.075;
      z-index:-1;
      pointer-events:none;
    }

    .accent{
      position:absolute;
      width:190px;
      height:13px;
      left:-95px;
      bottom:14%;
      border-radius:999px;
      background:var(--orange);
      transform:rotate(-38deg);
      opacity:.10;
      z-index:-1;
      pointer-events:none;
    }

    .center{
      width:100%;
      max-width:430px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      animation:brandIn .72s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo{
      display:block;
      width:min(76vw,330px);
      height:auto;
      max-height:240px;
      object-fit:contain;
      object-position:center;
      filter:drop-shadow(0 20px 34px rgba(0,0,0,.18));
      user-select:none;
      -webkit-user-drag:none;
    }

    .status{
      margin-top:34px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:13px;
    }

    .status-text{
      margin:0;
      color:var(--muted);
      font-size:10.5px;
      line-height:1.4;
      font-weight:600;
      letter-spacing:.085em;
      text-transform:uppercase;
    }

    .loader{
      position:relative;
      width:74px;
      height:3px;
      overflow:hidden;
      border-radius:999px;
      background:rgba(255,255,255,.12);
    }

    .loader::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:0;
      width:29px;
      border-radius:inherit;
      background:var(--orange);
      animation:loading 1.05s cubic-bezier(.65,0,.35,1) infinite;
    }

    .is-leaving .center{
      animation:brandOut .24s ease both;
    }

    @keyframes brandIn{
      from{opacity:0;transform:translateY(12px) scale(.985)}
      to{opacity:1;transform:none}
    }

    @keyframes brandOut{
      to{opacity:0;transform:translateY(-5px) scale(.992)}
    }

    @keyframes loading{
      0%{transform:translateX(-38px)}
      52%{transform:translateX(41px)}
      100%{transform:translateX(85px)}
    }

    @media (max-width:480px){
      .logo{
        width:min(82vw,300px);
      }

      .status{
        margin-top:28px;
      }
    }

    @media (max-height:620px){
      .logo{
        width:min(66vw,265px);
        max-height:190px;
      }

      .status{
        margin-top:20px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      .center,
      .is-leaving .center,
      .loader::after{
        animation:none;
      }
    }
  </style>
</head>

<body>
  <main class="splash" aria-label="Splash screen">
    <span class="accent" aria-hidden="true"></span>

    <section class="center" aria-live="polite">
      <img
        class="logo"
        src="./letsgo-logo.png"
        alt="LetsGo"
        decoding="async"
        fetchpriority="high"
      >

      <div class="status" aria-label="Memuat aplikasi">
        <p class="status-text">Menyiapkan perjalanan Anda</p>
        <div class="loader" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./splash.js"></script>
</body>
</html>
