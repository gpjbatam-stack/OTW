<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>Daftar — LetsGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./auth.css?v=20260827-flow-v3">
  <style>

    .letsgo-register-brand{display:flex;align-items:center;margin-bottom:18px}
    .letsgo-register-brand img{width:142px;height:44px;object-fit:contain;object-position:left center}
    .auth-card h1{color:#0B2034}
    .primary-btn{background:linear-gradient(135deg,#078FC6,#08BDEB 58%,#20D3F3)!important;box-shadow:0 10px 23px rgba(8,189,235,.22)!important}
    .auth-footer a,.password-toggle{color:#079FCB!important}
    .upload-icon{background:#E8F9FE!important;color:#079FCB!important}

    .upload-box{
      position:relative;
      border:1px dashed #cfd8e6;
      background:#f9fbfe;
      border-radius:16px;
      padding:16px;
      transition:.18s ease;
    }
    .upload-box:hover{border-color:#8cabff;background:#f5f8ff}
    .upload-box input[type=file]{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
      width:100%;
      height:100%;
    }
    .upload-inner{
      display:flex;
      gap:12px;
      align-items:center;
      pointer-events:none;
    }
    .upload-icon{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:#edf3ff;
      color:#2f6bff;
      flex:0 0 auto;
    }
    .upload-icon svg{width:20px;height:20px}
    .upload-title{
      font-size:12.5px;
      font-weight:800;
      color:#24324a;
    }
    .upload-sub{
      margin-top:3px;
      font-size:11.5px;
      line-height:1.45;
      color:#7b899d;
    }
    .preview{
      display:none;
      margin-top:12px;
      border-radius:14px;
      overflow:hidden;
      border:1px solid #e6ebf2;
      background:#fff;
    }
    .preview.show{display:block}
    .preview img{
      display:block;
      width:100%;
      max-height:190px;
      object-fit:cover;
    }
    .privacy-note{
      display:flex;
      gap:8px;
      align-items:flex-start;
      padding:11px 12px;
      border-radius:13px;
      background:#f6f8fb;
      color:#6f7d91;
      font-size:11px;
      line-height:1.5;
    }
    .privacy-note svg{
      width:15px;
      height:15px;
      flex:0 0 auto;
      margin-top:1px;
      color:#47648d;
    }
  </style>
  <style id="mobile-input-nozoom">
    @media (max-width: 768px) {
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="phone-frame">
      <div class="brand letsgo-register-brand">
        <img src="./letsgo-logo-horizontal.png" alt="LetsGo by mudamas">
      </div>

      <section class="auth-card">
        <a href="home.html" style="display:inline-flex;margin-bottom:14px;color:#6f8198;font-size:11px;font-weight:800;text-decoration:none">← Kembali ke Home</a>
        <p class="eyebrow">Buat akun</p>
        <h1>Daftar ke LetsGo</h1>
        <p class="lead">Buat akun untuk menyimpan pesanan, dokumen, dan perjalanan Anda.</p>

        <div id="notice" class="notice"></div>

        <form id="registerForm" class="form-grid">
          <div class="field">
            <label for="fullName">Nama lengkap</label>
            <div class="input-wrap no-icon">
              <input id="fullName" name="fullName" autocomplete="name" placeholder="Sesuai identitas" required>
            </div>
          </div>

          <div class="field">
            <label for="phone">Nomor HP</label>
            <div class="input-wrap no-icon">
              <input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
            </div>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <div class="input-wrap no-icon">
              <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap no-icon">
              <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Minimal 8 karakter" required minlength="8">
              <button class="password-toggle" id="togglePassword" type="button">Lihat</button>
            </div>
          </div>

          <div class="privacy-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="10" width="14" height="10" rx="2"/>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            Setelah email terverifikasi, Anda dapat melengkapi dokumen identitas perjalanan secara aman di akun LetsGo.
          </div>

          <button id="submitBtn" class="primary-btn" type="submit">Daftar & Verifikasi Email</button>
        </form>

        <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></p>
      </section>
    </div>
  </main>

  <script type="module" src="./register.js?v=20260827-flow-v3"></script>
</body>
</html>
